<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    line-height: 1.6;
}

header {
    background: #0d210f;
    color: white;
    text-align: center;
    padding: 20px;
}

nav {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    background: #333;
}

nav a {
    color: white;
    padding: 14px 20px;
    text-decoration: none;
}

nav a:hover {
    background: #4CAF50;
}

.container {
    max-width: 800px;
    margin: auto;
    padding: 20px;
}

.contact-box {
    background: #f4f4f4;
    padding: 20px;
    border-radius: 10px;
    margin-bottom: 20px;
    text-align: center;
}

.contact-box h2 {
    margin-bottom: 10px;
}

.contact-box p {
    font-size: 18px;
}

.contact-box strong {
    color: #1b5e20;
}

form {
    background: #f9f9f9;
    padding: 20px;
    border-radius: 10px;
}

label {
    display: block;
    margin-top: 10px;
    font-weight: bold;
}

input, textarea, select {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    border: 1px solid #ccc;
    border-radius: 5px;
}

button {
    margin-top: 15px;
    padding: 12px;
    background: #4CAF50;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    background: #45a049;
}
@media(max-width: 768px) {
    .container {
        padding: 15px;
    }
}
</style>
</head>

<body>

<header>
    <h1>Contact Us</h1>
    <p>We would love to assist you</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="destinations.html">Destinations</a>
    <a href="activities.html">Activities</a>
    <a href="gallery.html">Gallery</a>
    <a href="contact.html">Contact</a>
</nav>

<div class="container">
    <div class="contact-box">
        <h2>Get in Touch</h2>
        <p>You can contact us directly via email:</p>
        <p><strong>Visitrw@gmail.com</strong></p>
    </div>

    <h2>Send Us a Message</h2>

    <form action="mailto:Visitrw@gmail.com" method="POST" enctype="text/plain">

        <label>Full Name</label>
        <input type="text" name="Name" placeholder="Enter your full name" required>

        <label>Email Address</label>
        <input type="email" name="Email" placeholder="Enter your email" required>

        <label>Phone Number</label>
        <input type="tel" name="Phone" placeholder="Optional">

        <label>What do you need help with?</label>
        <select name="Service" required>
            <option value="">Select an option</option>
            <option>Travel Information</option>
            <option>Booking Assistance</option>
            <option>Tour Packages</option>
            <option>Other</option>
        </select>

        <label>Your Message</label>
        <textarea name="Message" rows="5" placeholder="Write your message here..." required></textarea>

        <button type="submit">Send Message</button>

    </form>

</div>

</body>
</html>
